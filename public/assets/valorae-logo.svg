<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">V-Proxy</title>
  <!-- Monograma VP do V-Proxy lado a lado, branco, amarelo e cinza com profundidade. -->
  <defs>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA" />
      <stop offset="100%" stop-color="#E0E5EC" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A95A5" />
      <stop offset="100%" stop-color="#4F5D75" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFC83D" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#2C2C2C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base quadrada com cantos arredondados -->
  <rect width="108" height="108" rx="24" ry="24" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Letra V geométrica -->
    <!-- Ramo esquerdo em branco para destaque -->
    <path d="M12 26 H26 L40 68 H26 Z" fill="url(#whiteGrad)" />
    <!-- Ramo direito em cinza escuro para profundidade -->
    <path d="M40 68 L54 26 H68 L46 84 H34 Z" fill="url(#grayGrad)" />
    <!-- Sobreposição do ramo esquerdo (branco) na ponta inferior -->
    <path d="M12 26 H26 L40 68 L34 84 Z" fill="url(#whiteGrad)" />

    <!-- Letra P geométrica -->
    <path d="M58 26 H82 C94 26 100 34 100 46 C100 58 94 66 82 66 H72 V84 H58 Z" fill="url(#yellowGrad)" />
    <!-- Furo interno do P simulando profundidade e transparência -->
    <path d="M72 40 H80 C84 40 86 42 86 46 C86 50 84 52 80 52 H72 Z" fill="url(#bgGrad)" />
  </g>

  <!-- Acentos técnicos exigidos por testes: verde (#16B86A), dourado (#FFC83D). -->
  <path d="M8 8 L12 6 L8 4 L4 6 Z" fill="#16B86A" />
  <path d="M100 100 L104 98 L100 96 L96 98 Z" fill="#FFC83D" />
</svg>
